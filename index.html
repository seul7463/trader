<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIS Guide Text Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js (이미지 OCR 텍스트 인식 라이브러리 추가) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#3b82f6', 600: '#2563eb' } } } }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">📈</span>
                <div>
                    <h1 class="font-bold text-lg tracking-tight">KIS Guide Text Trader</h1>
                    <p class="text-xs text-slate-400">이미지 및 텍스트 가이드 자동 파서</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button type="button" onclick="openApiModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-lg border border-slate-700 flex items-center space-x-1.5 transition cursor-pointer">
                    <span>⚙️</span>
                    <span>API 설정</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 space-y-6">
        
        <!-- Guide Input Panel (Text & Image Upload) -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold text-slate-300 flex items-center space-x-1.5">
                    <span>📋 가이드 입력 (텍스트 또는 캡처 이미지)</span>
                </h2>
                <!-- 이미지 파일 업로드 숨김 인풋 -->
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                <button type="button" onclick="document.getElementById('imageInput').click()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition flex items-center space-x-1 cursor-pointer">
                    <span>📷</span>
                    <span>가이드 캡처 사진 업로드</span>
                </button>
            </div>

            <textarea id="guideInput" rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-brand-500 font-mono" placeholder="가이드 텍스트를 붙여넣거나, 위 '가이드 캡처 사진 업로드' 버튼을 누르세요..."></textarea>
            
            <div class="flex justify-end">
                <button type="button" onclick="parseGuide()" class="bg-brand-600 hover:bg-brand-500 text-white font-medium text-sm px-4 py-2 rounded-lg shadow transition flex items-center space-x-1.5 cursor-pointer">
                    <span>✨</span>
                    <span>텍스트 파싱 및 주문 목록 생성</span>
                </button>
            </div>
        </section>

        <!-- Parsed Orders Preview & Action Table -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold text-slate-300">🛒 파싱된 주문 목록</h2>
                <div class="space-x-2">
                    <button type="button" onclick="clearOrders()" class="text-xs text-slate-400 hover:text-red-400 cursor-pointer">전체 초기화</button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs text-slate-400">
                            <th class="py-2.5 px-3">구분</th>
                            <th class="py-2.5 px-3">주문유형</th>
                            <th class="py-2.5 px-3">단가 ($)</th>
                            <th class="py-2.5 px-3">수량</th>
                            <th class="py-2.5 px-3 text-right">개별 전송</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody" class="divide-y divide-slate-800 text-sm">
                        <tr>
                            <td colspan="5" class="py-6 text-center text-slate-500 text-xs">가이드 텍스트나 사진을 업로드해 주세요.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Batch Execution Control -->
            <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
                <div class="text-xs text-slate-400">
                    총 주문 건수: <span id="totalOrderCount" class="font-bold text-slate-200">0건</span>
                </div>
                <button type="button" onclick="executeBatchOrders()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm px-5 py-2.5 rounded-lg shadow transition flex items-center space-x-1.5 cursor-pointer">
                    <span>🚀</span>
                    <span>전체 일괄 전송 (순차 접수)</span>
                </button>
            </div>
        </section>

        <!-- Execution Console & Log Area -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-sm font-semibold text-slate-300">🖥️ 실행 콘솔 & 로그</h2>
                <button type="button" onclick="clearLogs()" class="text-xs text-slate-500 hover:text-slate-300 cursor-pointer">로그 지우기</button>
            </div>
            <div id="logConsole" class="bg-slate-950 border border-slate-800 rounded-lg p-3 h-40 overflow-y-auto font-mono text-xs text-slate-300 space-y-1">
                <div class="text-slate-500">[시스템] 준비 완료. 캡처 사진을 업로드하거나 가이드를 입력해 보세요.</div>
            </div>
        </section>

    </main>

    <!-- API Modal -->
    <div id="apiModal" style="display: none; position: fixed; inset: 0; background-color: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center;">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-xl m-4" style="background-color: #0f172a; border: 1px solid #1e293b;">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-base text-slate-100">한국투자증권 API 설정</h3>
                <button type="button" onclick="closeApiModal()" class="text-slate-400 hover:text-slate-200 text-lg cursor-pointer">✕</button>
            </div>
            <p class="text-xs text-slate-400">입력하신 정보는 브라우저 로컬 스토리지에 안전하게 저장됩니다.</p>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">App Key</label>
                    <input type="text" id="cfgAppKey" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">App Secret</label>
                    <input type="password" id="cfgAppSecret" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">계좌번호 앞 8자리 (CANO)</label>
                    <input type="text" id="cfgCano" placeholder="예: 12345678" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">계좌상품코드 (ACNT_PRDT_CD)</label>
                    <input type="text" id="cfgPrdt" value="01" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">대상 종목 및 거래소</label>
                    <select id="cfgSymbol" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500">
                        <option value="TQQQ|NASD">TQQQ (나스닥 - NASD)</option>
                        <option value="SOXL|AMEX">SOXL (아멕스 - AMEX)</option>
                        <option value="KORU|AMEX">KORU (아멕스 - AMEX)</option>
                    </select>
                </div>
            </div>

            <div class="pt-2 flex justify-end space-x-2">
                <button type="button" onclick="closeApiModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg transition cursor-pointer">취소</button>
                <button type="button" onclick="saveApiSettings()" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-medium rounded-lg transition cursor-pointer">저장하기</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let parsedOrders = [];

        window.onload = function() {
            loadApiSettings();
        };

        function openApiModal() {
            const modal = document.getElementById('apiModal');
            if (modal) modal.style.display = 'flex';
        }

        function closeApiModal() {
            const modal = document.getElementById('apiModal');
            if (modal) modal.style.display = 'none';
        }

        function saveApiSettings() {
            localStorage.setItem('kis_app_key', document.getElementById('cfgAppKey').value.trim());
            localStorage.setItem('kis_app_secret', document.getElementById('cfgAppSecret').value.trim());
            localStorage.setItem('kis_cano', document.getElementById('cfgCano').value.trim());
            localStorage.setItem('kis_prdt', document.getElementById('cfgPrdt').value.trim());
            localStorage.setItem('kis_symbol', document.getElementById('cfgSymbol').value);
            closeApiModal();
            logMessage("시스템", "API 설정이 안전하게 저장되었습니다.");
        }

        function loadApiSettings() {
            if(localStorage.getItem('kis_app_key')) document.getElementById('cfgAppKey').value = localStorage.getItem('kis_app_key');
            if(localStorage.getItem('kis_app_secret')) document.getElementById('cfgAppSecret').value = localStorage.getItem('kis_app_secret');
            if(localStorage.getItem('kis_cano')) document.getElementById('cfgCano').value = localStorage.getItem('kis_cano');
            if(localStorage.getItem('kis_prdt')) document.getElementById('cfgPrdt').value = localStorage.getItem('kis_prdt');
            if(localStorage.getItem('kis_symbol')) document.getElementById('cfgSymbol').value = localStorage.getItem('kis_symbol');
        }

        // 이미지 업로드 시 Tesseract.js로 OCR 수행
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            logMessage("OCR", "📷 업로드된 캡처 사진에서 텍스트를 읽어오는 중입니다... (잠시만 기다려주세요)");
            
            try {
                const { data: { text } } = await Tesseract.recognize(file, 'eng+kor', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            logMessage("OCR", `진행률: ${Math.round(m.progress * 100)}%`);
                        }
                    }
                });

                document.getElementById('guideInput').value = text;
                logMessage("OCR", "✅ 텍스트 인식 완료! 아래 입력창에 추출된 내용이 채워졌습니다.");
                parseGuide(); // 자동 파싱 실행
            } catch (err) {
                logMessage("에러", "❌ 이미지 텍스트 인식 실패: " + err.message);
            }
        }

        // 텍스트 파서
        function parseGuide() {
            const text = document.getElementById('guideInput').value;
            if (!text.trim()) {
                alert("파싱할 내용이 없습니다.");
                return;
            }

            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            parsedOrders = [];

            let currentType = '매수'; 
            let lastPrice = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                if (line.includes('매수') || line.includes('매수 가이드')) { currentType = '매수'; continue; }
                if (line.includes('매도') || line.includes('매도 가이드')) { currentType = '매도'; continue; }
                if (line.includes('지정가')) {
                    if (line.includes('매도') || line.includes('15') || line.includes('20')) {
                        currentType = '지정가 매도';
                    }
                }

                // 가격 추출 ($가 포함된 경우 또는 숫자.숫자 형태)
                let priceMatch = line.match(/\$?([0-9]+\.[0-9]{2})/);
                if (priceMatch) {
                    lastPrice = parseFloat(priceMatch[1]);
                    
                    // 같은 줄에 수량이 같이 있는 경우 (예: $58.62 × 40주)
                    let qtyMatch = line.match(/([0-9]+)\s*주/);
                    if (qtyMatch && lastPrice !== null) {
                        let qtyVal = parseInt(qtyMatch[1]);
                        addOrder(currentType, lastPrice, qtyVal, line);
                        lastPrice = null;
                    }
                    continue;
                }

                // 수량만 따로 있는 경우 (예: 40주 또는 x 40주)
                if (line.includes('주') || line.includes('×') || line.includes('x')) {
                    let qtyMatch = line.match(/([0-9]+)\s*주/);
                    if (qtyMatch && lastPrice !== null) {
                        let qtyVal = parseInt(qtyMatch[1]);
                        addOrder(currentType, lastPrice, qtyVal, line);
                        lastPrice = null;
                    }
                }
            }

            renderOrderTable();
            logMessage("파서", `총 ${parsedOrders.length}개의 주문 항목이 성공적으로 파싱되었습니다.`);
        }

        function addOrder(typeStr, price, qty, rawLine) {
            let ordType = 'LOC';
            let buySellDvsn = '02'; // 매수
            let ordDvsn = '34';    // LOC
            let finalType = '매수';

            if (typeStr.includes('매도') || typeStr.includes('지정가') || rawLine.includes('지정가')) {
                buySellDvsn = '01'; // 매도
                finalType = '매도';
                if (typeStr.includes('지정가') || rawLine.includes('지정가')) {
                    ordType = '지정가';
                    ordDvsn = '00';
                }
            }

            parsedOrders.push({
                id: Date.now() + Math.random(),
                type: finalType,
                orderType: ordType,
                price: price,
                qty: qty,
                buySellDvsn: buySellDvsn,
                ordDvsn: ordDvsn
            });
        }

        function renderOrderTable() {
            const tbody = document.getElementById('orderTableBody');
            document.getElementById('totalOrderCount').innerText = `${parsedOrders.length}건`;

            if (parsedOrders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-500 text-xs">파싱된 주문이 없습니다. 사진을 다시 업로드하거나 텍스트를 확인해 주세요.</td></tr>`;
                return;
            }

            tbody.innerHTML = parsedOrders.map((ord, idx) => `
                <tr class="hover:bg-slate-800/50 transition">
                    <td class="py-2.5 px-3 font-medium text-slate-200">
                        <span class="inline-block px-2 py-0.5 rounded text-[10px] ${ord.buySellDvsn==='02'?'bg-blue-500/20 text-blue-400':'bg-amber-500/20 text-amber-400'}">${ord.type}</span>
                    </td>
                    <td class="py-2.5 px-3 text-slate-300 text-xs">${ord.orderType} (${ord.ordDvsn})</td>
                    <td class="py-2.5 px-3 font-mono text-slate-100">$${ord.price.toFixed(2)}</td>
                    <td class="py-2.5 px-3 font-mono text-slate-100">${ord.qty}주</td>
                    <td class="py-2.5 px-3 text-right">
                        <button type="button" onclick="sendSingleOrder(${idx})" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded border border-slate-700 transition cursor-pointer">전송</button>
                    </td>
                </tr>
            `).join('');
        }

        function clearOrders() {
            parsedOrders = [];
            renderOrderTable();
            logMessage("시스템", "주문 목록이 초기화되었습니다.");
        }

        function clearLogs() {
            document.getElementById('logConsole').innerHTML = `<div class="text-slate-500">[시스템] 로그가 초기화되었습니다.</div>`;
        }

        function logMessage(sender, msg) {
            const consoleBox = document.getElementById('logConsole');
            const timeStr = new Date().toLocaleTimeString();
            consoleBox.innerHTML += `<div><span class="text-slate-500">[${timeStr}]</span> <span class="text-brand-400">[${sender}]</span> ${msg}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        async function sendSingleOrder(index) {
            const ord = parsedOrders[index];
            const appKey = localStorage.getItem('kis_app_key');
            const cano = localStorage.getItem('kis_cano');
            const symbolData = localStorage.getItem('kis_symbol') || 'TQQQ|NASD';
            const [symbol, exchange] = symbolData.split('|');

            if (!appKey || !cano) {
                logMessage("에러", "API 설정(App Key 및 계좌번호)이 누락되었습니다. 우측 상단 'API 설정'을 먼저 완료해 주세요.");
                openApiModal();
                return;
            }

            logMessage("주문전송", `[${symbol}] 단가 $${ord.price.toFixed(2)} / ${ord.qty}주 (${ord.orderType}) 주문 전송 중...`);

            setTimeout(() => {
                logMessage("성공", `✅ [${symbol}] 주문 접수 성공 (시뮬레이션/테스트 응답 완료)`);
            }, 800);
        }

        async function executeBatchOrders() {
            if (parsedOrders.length === 0) {
                logMessage("경고", "전송할 주문 목록이 없습니다. 먼저 텍스트나 사진을 파싱해 주세요.");
                return;
            }

            logMessage("일괄전송", `총 ${parsedOrders.length}건의 주문을 2초 간격으로 순차 접수합니다...`);

            for (let i = 0; i < parsedOrders.length; i++) {
                await new Promise(r => setTimeout(r, 2000));
                logMessage("일괄전송", `[${i+1}/${parsedOrders.length}] 주문 전송 완료 (${parsedOrders[i].type} $${parsedOrders[i].price} x ${parsedOrders[i].qty}주)`);
            }

            logMessage("완료", "🎉 모든 일괄 주문 전송 시뮬레이션이 완료되었습니다!");
        }
    </script>
</body>
</html>
