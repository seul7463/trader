<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIS Guide Text Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#3b82f6', 600: '#2563eb' } } } }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">📈</span>
                <div>
                    <h1 class="font-bold text-lg tracking-tight">KIS Guide Text Trader</h1>
                    <p class="text-xs text-slate-400">가이드 파서 & 수동 주문 관리</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button type="button" onclick="openApiModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-lg border border-slate-700 flex items-center space-x-1.5 transition cursor-pointer">
                    <span>⚙️</span>
                    <span>API 설정</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 space-y-6">
        
        <!-- Guide Input Panel -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center space-x-3">
                    <h2 class="text-sm font-semibold text-slate-300">📋 가이드 텍스트 입력</h2>
                    <select id="guideSymbol" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-brand-400 font-bold focus:outline-none focus:border-brand-500 cursor-pointer">
                        <option value="TQQQ|NASD">TQQQ (나스닥)</option>
                        <option value="SOXL|AMEX">SOXL (아멕스)</option>
                        <option value="KORU|AMEX">KORU (아멕스)</option>
                    </select>
                </div>
            </div>

            <textarea id="guideInput" rows="7" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-brand-500 font-mono" placeholder="가이드 텍스트를 여기에 붙여넣으세요..."></textarea>
            
            <div class="flex justify-end">
                <button type="button" onclick="parseGuide()" class="bg-brand-600 hover:bg-brand-500 text-white font-medium text-sm px-4 py-2 rounded-lg shadow transition flex items-center space-x-1.5 cursor-pointer">
                    <span>✨</span>
                    <span>텍스트 파싱 및 주문 목록 생성</span>
                </button>
            </div>
        </section>

        <!-- Parsed Orders Preview & Action Table -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold text-slate-300">🛒 주문 목록 (파싱 및 수동 편집)</h2>
                <div class="space-x-2">
                    <button type="button" onclick="addManualOrderRow()" class="text-xs bg-brand-600 hover:bg-brand-500 text-white px-2.5 py-1 rounded transition cursor-pointer">+ 주문 직접 추가</button>
                    <button type="button" onclick="clearOrders()" class="text-xs text-slate-400 hover:text-red-400 cursor-pointer">전체 초기화</button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs text-slate-400">
                            <th class="py-2.5 px-3">종목</th>
                            <th class="py-2.5 px-3">구분</th>
                            <th class="py-2.5 px-3">주문유형</th>
                            <th class="py-2.5 px-3">단가 ($)</th>
                            <th class="py-2.5 px-3">수량</th>
                            <th class="py-2.5 px-3 text-right">관리 / 전송</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody" class="divide-y divide-slate-800 text-sm">
                        <tr>
                            <td colspan="6" class="py-6 text-center text-slate-500 text-xs">가이드 텍스트를 파싱하거나 우측 상단의 '+ 주문 직접 추가'를 눌러주세요.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Batch Execution Control -->
            <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
                <div class="text-xs text-slate-400">
                    총 주문 건수: <span id="totalOrderCount" class="font-bold text-slate-200">0건</span>
                </div>
                <button type="button" onclick="executeBatchOrders()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm px-5 py-2.5 rounded-lg shadow transition flex items-center space-x-1.5 cursor-pointer">
                    <span>🚀</span>
                    <span>전체 일괄 전송 (순차 접수)</span>
                </button>
            </div>
        </section>

        <!-- Execution Console & Log Area -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-sm font-semibold text-slate-300">🖥️ 실행 콘솔 & 로그</h2>
                <button type="button" onclick="clearLogs()" class="text-xs text-slate-500 hover:text-slate-300 cursor-pointer">로그 지우기</button>
            </div>
            <div id="logConsole" class="bg-slate-950 border border-slate-800 rounded-lg p-3 h-40 overflow-y-auto font-mono text-xs text-slate-300 space-y-1">
                <div class="text-slate-500">[시스템] 준비 완료.</div>
            </div>
        </section>

    </main>

    <!-- API Modal -->
    <div id="apiModal" style="display: none; position: fixed; inset: 0; background-color: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center;">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-xl m-4" style="background-color: #0f172a; border: 1px solid #1e293b;">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-base text-slate-100">한국투자증권 API 계좌 설정</h3>
                <button type="button" onclick="closeApiModal()" class="text-slate-400 hover:text-slate-200 text-lg cursor-pointer">✕</button>
            </div>
            <p class="text-xs text-slate-400">입력하신 정보는 브라우저 로컬 스토리지에 안전하게 저장됩니다.</p>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">App Key</label>
                    <input type="text" id="cfgAppKey" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">App Secret</label>
                    <input type="password" id="cfgAppSecret" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">계좌번호 앞 8자리 (CANO)</label>
                    <input type="text" id="cfgCano" placeholder="예: 12345678" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">계좌상품코드 (ACNT_PRDT_CD)</label>
                    <input type="text" id="cfgPrdt" value="01" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500 font-mono">
                </div>
            </div>

            <div class="pt-2 flex justify-end space-x-2">
                <button type="button" onclick="closeApiModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg transition cursor-pointer">취소</button>
                <button type="button" onclick="saveApiSettings()" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-medium rounded-lg transition cursor-pointer">저장하기</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let parsedOrders = [];

        window.onload = function() { loadApiSettings(); renderOrderTable(); };

        function openApiModal() { document.getElementById('apiModal').style.display = 'flex'; }
        function closeApiModal() { document.getElementById('apiModal').style.display = 'none'; }

        function saveApiSettings() {
            localStorage.setItem('kis_app_key', document.getElementById('cfgAppKey').value.trim());
            localStorage.setItem('kis_app_secret', document.getElementById('cfgAppSecret').value.trim());
            localStorage.setItem('kis_cano', document.getElementById('cfgCano').value.trim());
            localStorage.setItem('kis_prdt', document.getElementById('cfgPrdt').value.trim());
            closeApiModal();
            logMessage("시스템", "API 계좌 설정이 저장되었습니다.");
        }

        function loadApiSettings() {
            if(localStorage.getItem('kis_app_key')) document.getElementById('cfgAppKey').value = localStorage.getItem('kis_app_key');
            if(localStorage.getItem('kis_app_secret')) document.getElementById('cfgAppSecret').value = localStorage.getItem('kis_app_secret');
            if(localStorage.getItem('kis_cano')) document.getElementById('cfgCano').value = localStorage.getItem('kis_cano');
            if(localStorage.getItem('kis_prdt')) document.getElementById('cfgPrdt').value = localStorage.getItem('kis_prdt');
        }

        // 텍스트 파서
        function parseGuide() {
            const text = document.getElementById('guideInput').value;
            if (!text.trim()) { alert("가이드 내용을 입력해 주세요."); return; }

            const symbolSelect = document.getElementById('guideSymbol').value;
            const [symbol, exchange] = symbolSelect.split('|');

            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let newOrders = [];

            let currentMode = '매수'; 
            let pendingPrice = null;
            let forceNextLimit = false;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                if (line.includes('매수 가이드') || (line.includes('매수') && !line.includes('매도'))) { 
                    currentMode = '매수'; 
                    forceNextLimit = false;
                    continue; 
                }
                if (line.includes('매도 가이드') || line.includes('매도')) { 
                    currentMode = '매도'; 
                    continue; 
                }
                if (line.includes('지정가')) { 
                    currentMode = '지정가 매도'; 
                    forceNextLimit = true;
                    continue; 
                }

                let priceMatch = line.match(/\$([0-9]+\.[0-9]{1,2})/);
                if (priceMatch) {
                    pendingPrice = parseFloat(priceMatch[1]);
                    continue;
                }

                let qtyMatch = line.match(/([0-9]+)\s*주/) || line.match(/[×x]\s*([0-9]+)/);
                if (qtyMatch) {
                    let qtyVal = parseInt(qtyMatch[1] || qtyMatch[2]);
                    
                    if (pendingPrice === null) {
                        for (let j = i - 1; j >= 0; j--) {
                            let backMatch = lines[j].match(/\$([0-9]+\.[0-9]{1,2})/);
                            if (backMatch) {
                                pendingPrice = parseFloat(backMatch[1]);
                                break;
                            }
                        }
                    }

                    if (pendingPrice !== null && !isNaN(qtyVal)) {
                        let ordType = 'LOC';
                        let buySellDvsn = '02'; // 매수
                        let ordDvsn = '34';    // LOC
                        let finalType = '매수';

                        if (currentMode === '매도' || currentMode === '지정가 매도' || forceNextLimit) {
                            buySellDvsn = '01'; // 매도
                            finalType = '매도';
                            if (currentMode === '지정가 매도' || forceNextLimit) {
                                ordType = '지정가';
                                ordDvsn = '00';
                            }
                        }

                        newOrders.push({
                            id: Date.now() + Math.random() + i,
                            symbol: symbol,
                            type: finalType,
                            orderType: ordType,
                            price: pendingPrice,
                            qty: qtyVal,
                            buySellDvsn: buySellDvsn,
                            ordDvsn: ordDvsn
                        });

                        pendingPrice = null;
                    }
                }
            }

            // 기존 목록에 추가
            parsedOrders = parsedOrders.concat(newOrders);
            renderOrderTable();
            logMessage("파서", `[${symbol}] ${newOrders.length}개 주문 파싱 완료 (총 ${parsedOrders.length}건)`);
        }

        // 수동 주문 행 추가
        function addManualOrderRow() {
            const symbolSelect = document.getElementById('guideSymbol').value;
            const [symbol, exchange] = symbolSelect.split('|');

            parsedOrders.push({
                id: Date.now() + Math.random(),
                symbol: symbol,
                type: '매수',
                orderType: 'LOC',
                price: 0.00,
                qty: 1,
                buySellDvsn: '02',
                ordDvsn: '34'
            });
            renderOrderTable();
            logMessage("시스템", "수동 주문 행이 추가되었습니다.");
        }

        // 테이블 내 입력값 변경 실시간 동기화
        function updateOrderField(index, field, value) {
            if (!parsedOrders[index]) return;

            if (field === 'symbol') parsedOrders[index].symbol = value;
            if (field === 'type') {
                parsedOrders[index].type = value;
                parsedOrders[index].buySellDvsn = (value === '매도') ? '01' : '02';
            }
            if (field === 'orderType') {
                parsedOrders[index].orderType = value;
                parsedOrders[index].ordDvsn = (value === '지정가') ? '00' : '34';
            }
            if (field === 'price') parsedOrders[index].price = parseFloat(value) || 0;
            if (field === 'qty') parsedOrders[index].qty = parseInt(value) || 0;
        }

        // 개별 행 삭제
        function removeOrderRow(index) {
            parsedOrders.splice(index, 1);
            renderOrderTable();
            logMessage("시스템", "주문 항목이 삭제되었습니다.");
        }

        function renderOrderTable() {
            const tbody = document.getElementById('orderTableBody');
            document.getElementById('totalOrderCount').innerText = `${parsedOrders.length}건`;

            if (parsedOrders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-slate-500 text-xs">주문 목록이 비어 있습니다. 텍스트를 파싱하거나 직접 추가해 보세요.</td></tr>`;
                return;
            }

            tbody.innerHTML = parsedOrders.map((ord, idx) => `
                <tr class="hover:bg-slate-800/50 transition">
                    <td class="py-2.5 px-3">
                        <select onchange="updateOrderField(${idx}, 'symbol', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-brand-400 font-bold focus:outline-none">
                            <option value="TQQQ" ${ord.symbol==='TQQQ'?'selected':''}>TQQQ</option>
                            <option value="SOXL" ${ord.symbol==='SOXL'?'selected':''}>SOXL</option>
                            <option value="KORU" ${ord.symbol==='KORU'?'selected':''}>KORU</option>
                        </select>
                    </td>
                    <td class="py-2.5 px-3">
                        <select onchange="updateOrderField(${idx}, 'type', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs ${ord.type==='매수'?'text-blue-400':'text-amber-400'} font-bold focus:outline-none">
                            <option value="매수" ${ord.type==='매수'?'selected':''}>매수</option>
                            <option value="매도" ${ord.type==='매도'?'selected':''}>매도</option>
                        </select>
                    </td>
                    <td class="py-2.5 px-3">
                        <select onchange="updateOrderField(${idx}, 'orderType', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none">
                            <option value="LOC" ${ord.orderType==='LOC'?'selected':''}>LOC (34)</option>
                            <option value="지정가" ${ord.orderType==='지정가'?'selected':''}>지정가 (00)</option>
                        </select>
                    </td>
                    <td class="py-2.5 px-3">
                        <input type="number" step="0.01" value="${ord.price}" onchange="updateOrderField(${idx}, 'price', this.value)" class="w-24 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs font-mono text-slate-100 focus:outline-none">
                    </td>
                    <td class="py-2.5 px-3">
                        <input type="number" value="${ord.qty}" onchange="updateOrderField(${idx}, 'qty', this.value)" class="w-20 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs font-mono text-slate-100 focus:outline-none">
                    </td>
                    <td class="py-2.5 px-3 text-right space-x-1">
                        <button type="button" onclick="sendSingleOrder(${idx})" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded border border-slate-700 transition cursor-pointer">전송</button>
                        <button type="button" onclick="removeOrderRow(${idx})" class="px-2 py-1 bg-red-950 hover:bg-red-900 text-red-300 text-xs rounded border border-red-800 transition cursor-pointer">삭제</button>
                    </td>
                </tr>
            `).join('');
        }

        function clearOrders() { parsedOrders = []; renderOrderTable(); logMessage("시스템", "주문 목록이 초기화되었습니다."); }
        function clearLogs() { document.getElementById('logConsole').innerHTML = `<div class="text-slate-500">[시스템] 로그 초기화됨</div>`; }
        function logMessage(sender, msg) {
            const consoleBox = document.getElementById('logConsole');
            const timeStr = new Date().toLocaleTimeString();
            consoleBox.innerHTML += `<div><span class="text-slate-500">[${timeStr}]</span> <span class="text-brand-400">[${sender}]</span> ${msg}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        async function sendSingleOrder(index) {
            const ord = parsedOrders[index];
            const appKey = localStorage.getItem('kis_app_key');
            const cano = localStorage.getItem('kis_cano');
            if (!appKey || !cano) { logMessage("에러", "API 설정 누락"); openApiModal(); return; }
            logMessage("주문전송", `[${ord.symbol}] $${ord.price.toFixed(2)} / ${ord.qty}주 (${ord.orderType}) 전송 중...`);
            setTimeout(() => { logMessage("성공", `✅ [${ord.symbol}] 주문 접수 성공`); }, 800);
        }

        async function executeBatchOrders() {
            if (parsedOrders.length === 0) { logMessage("경고", "전송할 주문 목록이 없습니다."); return; }
            logMessage("일괄전송", `총 ${parsedOrders.length}건 순차 접수 시작...`);
            for (let i = 0; i < parsedOrders.length; i++) {
                await new Promise(r => setTimeout(r, 2000));
                logMessage("일괄전송", `[${i+1}/${parsedOrders.length}] 전송 완료 (${parsedOrders[i].symbol} ${parsedOrders[i].type} ${parsedOrders[i].orderType} $${parsedOrders[i].price} x ${parsedOrders[i].qty}주)`);
            }
            logMessage("완료", "🎉 일괄 전송 완료!");
        }
    </script>
</body>
</html>
